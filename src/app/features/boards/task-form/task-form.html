<form class="form" novalidate [formGroup]="form" (ngSubmit)="submit()">
  <div>
    <label class="label" for="task-title">Title</label>
    <div class="control">
      <input
        id="task-title"
        class="input"
        placeholder="e.g. Take coffee break"
        formControlName="title"
      />
      @if (form.controls.title.invalid && form.controls.title.touched) {
        <span class="error">Can't be empty</span>
      }
    </div>
  </div>

  <div>
    <label class="label" for="task-description">Description</label>
    <textarea
      id="task-description"
      class="input"
      placeholder="e.g. It's always good to take a break. This 15 minute break will recharge the batteries a little."
      formControlName="description"
    ></textarea>
  </div>

  <fieldset class="form-rows" formArrayName="subtasks">
    <legend class="label">Subtasks</legend>

    @for (subtask of subtasks.controls; track subtask; let i = $index) {
      <div class="form-row" [formGroupName]="i">
        <div class="control">
          <input
            class="input"
            [attr.aria-label]="'Subtask ' + (i + 1)"
            [placeholder]="i === 0 ? 'e.g. Make coffee' : 'e.g. Drink coffee & smile'"
            formControlName="title"
          />
          @if (subtask.controls.title.invalid && subtask.controls.title.touched) {
            <span class="error">Can't be empty</span>
          }
        </div>
        <button
          type="button"
          class="remove-row"
          [attr.aria-label]="'Remove subtask ' + (i + 1)"
          (click)="removeSubtask(i)"
        >
          <app-icon name="cross" />
        </button>
      </div>
    }

    <button type="button" class="btn btn-secondary btn-block" (click)="addSubtask()">
      + Add New Subtask
    </button>
  </fieldset>

  <div>
    <label class="label" for="task-status">Status</label>
    <select id="task-status" class="select" formControlName="columnId">
      @for (column of statuses(); track column.id) {
        <option [value]="column.id">{{ column.name }}</option>
      }
    </select>
  </div>

  <div>
    <label class="label" for="task-due-date">Due Date (optional)</label>
    <input id="task-due-date" type="date" class="input" formControlName="dueDate" />
  </div>

  <button type="submit" class="btn btn-primary btn-block">{{ submitLabel() }}</button>
</form>
