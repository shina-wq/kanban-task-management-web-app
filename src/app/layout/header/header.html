<a class="logo" routerLink="/boards" aria-label="Kanban — all boards">
  <app-icon name="logo-mark" class="logo-mark" />
  <span class="wordmark">kanban</span>
</a>

<div class="bar">
  <!-- Title. On mobile it also opens the board dropdown. -->
  <div class="title-wrap" (appClickOutside)="mobileNavOpen.set(false)">
    <h1 class="title">{{ title() }}</h1>

    <button
      type="button"
      class="mobile-nav-toggle"
      aria-label="Show boards"
      aria-controls="mobile-nav"
      [attr.aria-expanded]="mobileNavOpen()"
      (click)="mobileNavOpen.update((open) => !open)"
    >
      <app-icon [name]="mobileNavOpen() ? 'chevron-up' : 'chevron-down'" />
    </button>

    @if (mobileNavOpen()) {
      <div id="mobile-nav" class="mobile-nav">
        <nav aria-label="Boards">
          <app-board-nav (navigate)="mobileNavOpen.set(false)" />
        </nav>
        <app-theme-toggle />
      </div>
    }
  </div>

  @if (mobileNavOpen()) {
    <div class="backdrop"></div>
  }

  <!-- Board actions -->
  @if (board(); as board) {
    <div class="actions">
      @if (board.columns.length) {
        <app-board-search />
      }

      <a
        class="btn btn-primary btn-lg add-task"
        [routerLink]="['/boards', board.id, 'tasks', 'new']"
        [attr.aria-disabled]="board.columns.length === 0"
        aria-label="Add new task"
      >
        <app-icon name="plus" />
        <span class="add-task-label">Add New Task</span>
      </a>

      <app-menu label="Board options">
        <a class="menu-item" role="menuitem" [routerLink]="['/boards', board.id, 'edit']">
          Edit Board
        </a>
        <a class="menu-item danger" role="menuitem" [routerLink]="['/boards', board.id, 'delete']">
          Delete Board
        </a>
      </app-menu>
    </div>
  }
</div>
